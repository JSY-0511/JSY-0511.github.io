<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>中秋烟花祝福 · 豪华梦幻版</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: radial-gradient(ellipse at center, #121550 0%, #070824 60%, #000 100%);
  }
  canvas {
    display: block;
    position: fixed;
    inset: 0;
  }
</style>
</head>
<body>
<canvas id="fireworks"></canvas>

<script>
const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

// ===== 基础设置 =====
const stars = [];
const moonHalos = [];
const clouds = [];
const fireworks = [];
const particles = [];
const lightTrails = [];
const afterglows = [];
const lanterns = [];
const textParticles = [];
const foregroundSparkles = [];

const palettes = [
  ["#ff2e63", "#ffd36e", "#ffffff"],
  ["#7b68ee", "#00d4ff", "#ffffff"],
  ["#ff69b4", "#ffa500", "#ffee88"],
  ["#39ff14", "#00ffff", "#ffffff"],
  ["#ff4500", "#ff0080", "#ffdd00"],
  ["#c77dff", "#90e0ef", "#ffffff"],
  ["#ffd700", "#ff8c00", "#ffffff"]
];

const wind = { x: 0.14, y: 0.012 };
const vortex = { x: 0, y: 0, strength: 0 };

// ===== 星空 =====
for (let i = 0; i < 340; i++) {
  stars.push({
    x: Math.random() * W,
    y: Math.random() * H * 0.8,
    r: Math.random() * 1.6 + 0.2,
    a: Math.random(),
    s: Math.random() * 0.018 + 0.004
  });
}

// ===== 圆月与月晕 =====
const moon = {
  x: 0,
  y: 0,
  r: Math.min(W, H) * 0.07
};
function updateMoonPosition() {
  moon.x = W * 0.82;
  moon.y = H * 0.18;
  moon.r = Math.min(W, H) * 0.07;
}
updateMoonPosition();
window.addEventListener("resize", updateMoonPosition);

for (let i = 0; i < 4; i++) {
  moonHalos.push({
    r: moon.r * (1.3 + i * 0.9),
    a: 0.22 - i * 0.05,
    color: i % 2 === 0 ? "255,255,255" : "200,220,255"
  });
}

// ===== 薄云 =====
for (let i = 0; i < 5; i++) {
  clouds.push({
    x: Math.random() * W,
    y: Math.random() * H * 0.4 + H * 0.05,
    width: Math.random() * 260 + 180,
    height: Math.random() * 40 + 18,
    speed: Math.random() * 0.04 + 0.01,
    a: Math.random() * 0.08 + 0.03
  });
}

// ===== 前景光斑 =====
for (let i = 0; i < 40; i++) {
  foregroundSparkles.push({
    x: Math.random() * W,
    y: Math.random() * H,
    r: Math.random() * 2.2 + 0.4,
    a: Math.random(),
    s: Math.random() * 0.02 + 0.005,
    color: ["#ffffff", "#ffd700", "#ffa500", "#ff69b4"][Math.floor(Math.random() * 4)]
  });
}

// ===== 孔明灯 =====
for (let i = 0; i < 18; i++) {
  lanterns.push({
    x: Math.random() * W,
    y: H + Math.random() * 300,
    vy: Math.random() * 0.55 + 0.25,
    vx: (Math.random() - 0.5) * 0.35,
    size: Math.random() * 18 + 26,
    flicker: Math.random() * Math.PI * 2
  });
}

// ===== 祝福文字序列 =====
const textList = [
  { time: 3,  text: "3" },
  { time: 4,  text: "2" },
  { time: 5,  text: "1" },
  { time: 6,  text: "祝徐雅晖" },
  { time: 8,  text: "中秋节快乐" },
  { time: 10, text: "愿我们" },
  { time: 12, text: "长长久久" },
  { time: 14, text: "昭昭如愿" },
  { time: 16, text: "岁岁安澜" },
  { time: 18, text: "我永远爱你" }
];

let currentText = "";
let textAlpha = 0;
let textFadeIn = false;
let textFadeOut = false;
let textHoldTime = 0;
let sequenceIndex = 0;
let startTime = Date.now();

// ===== 文字粒子生成 =====
function createTextParticles(text) {
  const tempCanvas = document.createElement('canvas');
  const tempCtx = tempCanvas.getContext('2d');
  const fontSize = Math.min(90, Math.floor(W / 9));
  tempCanvas.width = W;
  tempCanvas.height = H;
  
  tempCtx.fillStyle = 'white';
  tempCtx.font = `bold ${fontSize}px "Microsoft YaHei", "PingFang SC", sans-serif`;
  tempCtx.textAlign = 'center';
  tempCtx.textBaseline = 'middle';
  tempCtx.fillText(text, W / 2, H / 2);
  
  const imageData = tempCtx.getImageData(0, 0, W, H);
  const data = imageData.data;
  const gap = 7;
  
  textParticles.length = 0;
  
  for (let y = 0; y < H; y += gap) {
    for (let x = 0; x < W; x += gap) {
      const index = (y * W + x) * 4;
      if (data[index + 3] > 128) {
        textParticles.push({
          x: Math.random() * W,
          y: Math.random() * H,
          targetX: x,
          targetY: y,
          vx: 0,
          vy: 0,
          size: Math.random() * 1.6 + 0.9,
          color: palettes[Math.floor(Math.random() * palettes.length)][Math.floor(Math.random() * 3)],
          alpha: 0,
          state: 'fly'
        });
      }
    }
  }
}

// ===== 烟花发射 =====
function launchFirework(x, y, targetY, palette) {
  fireworks.push({
    x, y,
    targetY,
    vy: -(Math.random() * 3 + 7),
    vx: (Math.random() - 0.5) * 2.4,
    color: palette[Math.floor(Math.random() * palette.length)],
    palette,
    trail: []
  });
}

// ===== 豪华爆炸 =====
function explode(fw) {
  const palette = fw.palette;
  const type = Math.random();

  afterglows.push({
    x: fw.x, y: fw.y,
    r: 14,
    maxR: Math.random() * 160 + 130,
    a: 0.92,
    color: palette[0]
  });

  vortex.x = fw.x;
  vortex.y = fw.y;
  vortex.strength = 0.75;

  if (type < 0.25) {
    // 双层金色花冠
    for (let i = 0; i < 100; i++) {
      const angle = (Math.PI * 2 * i) / 100;
      particles.push({
        x: fw.x, y: fw.y,
        vx: Math.cos(angle) * 3.4,
        vy: Math.sin(angle) * 3.4,
        life: 1,
        decay: 0.01,
        color: "#ffd700",
        size: 1.4,
        trail: [],
        flow: "ring"
      });
    }
    for (let i = 0; i < 80; i++) {
      const angle = (Math.PI * 2 * i) / 80;
      particles.push({
        x: fw.x, y: fw.y,
        vx: Math.cos(angle) * 6.8,
        vy: Math.sin(angle) * 6.8,
        life: 1,
        decay: 0.013,
        color: palette[2] || "#ffffff",
        size: 1.1,
        trail: [],
        flow: "ring"
      });
    }
  } else if (type < 0.55) {
    // 星芒拖尾
    for (let i = 0; i < 240; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 6.5 + 1;
      particles.push({
        x: fw.x, y: fw.y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1,
        decay: Math.random() * 0.01 + 0.008,
        color: palette[Math.floor(Math.random() * palette.length)],
        size: Math.random() * 1.7 + 0.7,
        trail: [],
        flow: "star"
      });
    }
  } else if (type < 0.8) {
    // 粒子流瀑布
    for (let i = 0; i < 180; i++) {
      particles.push({
        x: fw.x + (Math.random() - 0.5) * 30,
        y: fw.y,
        vx: (Math.random() - 0.5) * 2.2,
        vy: Math.random() * 4.4 + 1.5,
        life: 1,
        decay: Math.random() * 0.009 + 0.008,
        color: palette[Math.floor(Math.random() * palette.length)],
        size: Math.random() * 1.5 + 0.8,
        trail: [],
        flow: "waterfall"
      });
    }
  } else {
    // 环形扩散
    const count = 160;
    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 * i) / count;
      const speed = Math.random() * 1.8 + 4.4;
      particles.push({
        x: fw.x, y: fw.y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1,
        decay: Math.random() * 0.007 + 0.007,
        color: palette[i % palette.length],
        size: Math.random() * 1.7 + 1.1,
        trail: [],
        flow: "arc"
      });
    }
  }

  // 彩色光带
  for (let i = 0; i < 40; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 2.2 + 1;
    lightTrails.push({
      x: fw.x, y: fw.y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 1,
      life: 1,
      decay: 0.0055,
      color: palette[Math.floor(Math.random() * palette.length)],
      width: Math.random() * 2.2 + 1.3
    });
  }

  // 金色星屑
  for (let i = 0; i < 60; i++) {
    particles.push({
      x: fw.x, y: fw.y,
      vx: (Math.random() - 0.5) * 3,
      vy: (Math.random() - 0.5) * 3,
      life: 1,
      decay: 0.012,
      color: "#ffd700",
      size: Math.random() * 1.3 + 0.6,
      trail: [],
      flow: "sparkle"
    });
  }
}

// ===== 绘制月亮 =====
function drawMoon() {
  // 月晕
  for (const halo of moonHalos) {
    const grad = ctx.createRadialGradient(moon.x, moon.y, moon.r, moon.x, moon.y, halo.r);
    grad.addColorStop(0, `rgba(${halo.color}, ${halo.a})`);
    grad.addColorStop(1, `rgba(${halo.color}, 0)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(moon.x, moon.y, halo.r, 0, Math.PI * 2);
    ctx.fill();
  }

  // 月亮本体
  const moonGrad = ctx.createRadialGradient(moon.x - moon.r * 0.3, moon.y - moon.r * 0.3, moon.r * 0.2, moon.x, moon.y, moon.r);
  moonGrad.addColorStop(0, "#ffffff");
  moonGrad.addColorStop(0.7, "#f5f1c8");
  moonGrad.addColorStop(1, "#d8cfa0");
  ctx.fillStyle = moonGrad;
  ctx.beginPath();
  ctx.arc(moon.x, moon.y, moon.r, 0, Math.PI * 2);
  ctx.fill();
}

// ===== 绘制薄云 =====
function drawClouds() {
  for (const c of clouds) {
    c.x += c.speed;
    if (c.x - c.width / 2 > W) c.x = -c.width / 2;

    const grad = ctx.createLinearGradient(c.x - c.width / 2, c.y, c.x + c.width / 2, c.y);
    grad.addColorStop(0, `rgba(180, 210, 255, 0)`);
    grad.addColorStop(0.5, `rgba(180, 210, 255, ${c.a})`);
    grad.addColorStop(1, `rgba(180, 210, 255, 0)`);

    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.ellipse(c.x, c.y, c.width / 2, c.height / 2, 0, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ===== 绘制星空 =====
function drawStars() {
  for (const s of stars) {
    s.a += s.s;
    const alpha = 0.45 + Math.abs(Math.sin(s.a)) * 0.55;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.fill();
  }
}

// ===== 绘制前景光斑 =====
function drawForegroundSparkles() {
  for (const s of foregroundSparkles) {
    s.a += s.s;
    const alpha = 0.35 + Math.abs(Math.sin(s.a)) * 0.45;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = hexToRgba(s.color, alpha);
    ctx.shadowColor = s.color;
    ctx.shadowBlur = 8;
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

// ===== 绘制孔明灯 =====
function drawLanterns() {
  for (const l of lanterns) {
    l.y += l.vy;
    l.x += l.vx + Math.sin(l.y * 0.01) * 0.4;
    l.flicker += 0.08;

    if (l.y < -80) {
      l.y = H + 100;
      l.x = Math.random() * W;
    }

    ctx.save();
    ctx.translate(l.x, l.y);

    const grad = ctx.createRadialGradient(0, 0, 2, 0, 0, l.size);
    grad.addColorStop(0, `rgba(255, 220, 120, ${0.9 + Math.sin(l.flicker) * 0.1})`);
    grad.addColorStop(0.4, "rgba(255, 140, 60, 0.5)");
    grad.addColorStop(1, "rgba(255, 80, 20, 0)");
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.ellipse(0, 0, l.size * 0.55, l.size, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "rgba(255,255,220,0.9)";
    ctx.beginPath();
    ctx.ellipse(0, -l.size * 0.3, l.size * 0.18, l.size * 0.35, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }
}

// ===== 绘制文字粒子 =====
function drawTextParticles() {
  if (textParticles.length === 0) return;
  
  for (const p of textParticles) {
    if (p.state === 'fly') {
      const dx = p.targetX - p.x;
      const dy = p.targetY - p.y;
      const dist = Math.hypot(dx, dy);
      
      if (dist < 5) {
        p.state = 'stay';
        p.alpha = 1;
      } else {
        p.vx += dx * 0.05;
        p.vy += dy * 0.05;
        p.vx *= 0.9;
        p.vy *= 0.9;
        p.x += p.vx;
        p.y += p.vy;
        p.alpha = Math.min(1, p.alpha + 0.05);
      }
    } else if (p.state === 'stay') {
      p.x += (Math.random() - 0.5) * 0.5;
      p.y += (Math.random() - 0.5) * 0.5;
      
      if (textFadeOut) {
        p.state = 'fade';
      }
    } else if (p.state === 'fade') {
      p.vx += (Math.random() - 0.5) * 0.2;
      p.vy += (Math.random() - 0.5) * 0.2;
      p.vy -= 0.1;
      p.x += p.vx;
      p.y += p.vy;
      p.alpha -= 0.02;
    }
    
    if (p.alpha > 0) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fillStyle = hexToRgba(p.color, p.alpha);
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 10;
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  }
  
  for (let i = textParticles.length - 1; i >= 0; i--) {
    if (textParticles[i].alpha <= 0) {
      textParticles.splice(i, 1);
    }
  }
}

// ===== 主循环 =====
function animate() {
  ctx.fillStyle = "rgba(5, 6, 26, 0.22)";
  ctx.fillRect(0, 0, W, H);

  drawStars();
  drawClouds();
  drawMoon();
  drawLanterns();

  vortex.strength *= 0.985;

  // 烟花上升
  for (let i = fireworks.length - 1; i >= 0; i--) {
    const fw = fireworks[i];
    fw.trail.push({ x: fw.x, y: fw.y });
    if (fw.trail.length > 14) fw.trail.shift();

    fw.x += fw.vx;
    fw.y += fw.vy;
    fw.vy += 0.04;

    for (let t = 0; t < fw.trail.length; t++) {
      const p = fw.trail[t];
      const alpha = t / fw.trail.length;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 2 * alpha, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.8})`;
      ctx.fill();
    }

    ctx.beginPath();
    ctx.arc(fw.x, fw.y, 2.8, 0, Math.PI * 2);
    ctx.fillStyle = fw.color;
    ctx.shadowColor = fw.color;
    ctx.shadowBlur = 16;
    ctx.fill();
    ctx.shadowBlur = 0;

    if (fw.vy >= -1 || fw.y <= fw.targetY) {
      explode(fw);
      fireworks.splice(i, 1);
    }
  }

  // 粒子
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];

    p.trail.push({ x: p.x, y: p.y });
    if (p.trail.length > 12) p.trail.shift();

    p.vx += wind.x * 0.012;
    p.vy += wind.y * 0.012;

    if (vortex.strength > 0.05) {
      const dx = p.x - vortex.x;
      const dy = p.y - vortex.y;
      const dist = Math.hypot(dx, dy) + 0.1;
      const force = vortex.strength / dist;
      p.vx += -dy * force * 0.02;
      p.vy += dx * force * 0.02;
    }

    if (p.flow === "ring") {
      p.vx *= 0.97;
      p.vy *= 0.97;
    }

    p.x += p.vx;
    p.y += p.vy;
    p.vx *= 0.985;
    p.vy *= 0.985;
    p.vy += 0.045;
    p.life -= p.decay;

    for (let t = 0; t < p.trail.length; t++) {
      const tp = p.trail[t];
      const alpha = (t / p.trail.length) * p.life * 0.7;
      ctx.beginPath();
      ctx.arc(tp.x, tp.y, p.size * 0.7 * alpha, 0, Math.PI * 2);
      ctx.fillStyle = hexToRgba(p.color, alpha);
      ctx.fill();
    }

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fillStyle = hexToRgba(p.color, p.life);
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 13;
    ctx.fill();
    ctx.shadowBlur = 0;

    if (p.life <= 0) particles.splice(i, 1);
  }

  // 彩色光带
  for (let i = lightTrails.length - 1; i >= 0; i--) {
    const t = lightTrails[i];

    t.vx += wind.x * 0.01;
    t.vy += 0.015;
    t.x += t.vx;
    t.y += t.vy;
    t.life -= t.decay;

    ctx.beginPath();
    ctx.arc(t.x, t.y, t.width * t.life, 0, Math.PI * 2);
    ctx.fillStyle = hexToRgba(t.color, t.life * 0.8);
    ctx.shadowColor = t.color;
    ctx.shadowBlur = 11;
    ctx.fill();
    ctx.shadowBlur = 0;

    if (t.life <= 0) lightTrails.splice(i, 1);
  }

  // 光晕余烬
  for (let i = afterglows.length - 1; i >= 0; i--) {
    const a = afterglows[i];
    a.r += 3;
    a.a -= 0.011;

    const grad = ctx.createRadialGradient(a.x, a.y, 0, a.x, a.y, a.r);
    grad.addColorStop(0, hexToRgba(a.color, a.a * 0.5));
    grad.addColorStop(0.5, hexToRgba(a.color, a.a * 0.18));
    grad.addColorStop(1, hexToRgba(a.color, 0));
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(a.x, a.y, a.r, 0, Math.PI * 2);
    ctx.fill();

    if (a.a <= 0) afterglows.splice(i, 1);
  }

  // 前景光斑
  drawForegroundSparkles();

  // 文字时间控制
  const now = (Date.now() - startTime) / 1000;
  if (sequenceIndex < textList.length && now >= textList[sequenceIndex].time) {
    currentText = textList[sequenceIndex].text;
    textFadeIn = true;
    textFadeOut = false;
    textHoldTime = 0;
    sequenceIndex++;
    
    createTextParticles(currentText);

    for (let k = 0; k < 5; k++) {
      setTimeout(() => {
        const x = W / 2 + (Math.random() - 0.5) * 260;
        const y = H;
        const targetY = H * 0.35 + Math.random() * H * 0.2;
        const palette = palettes[Math.floor(Math.random() * palettes.length)];
        launchFirework(x, y, targetY, palette);
      }, k * 160);
    }
  }

  if (textFadeIn) {
    textAlpha += 0.04;
    if (textAlpha >= 1) {
      textAlpha = 1;
      textFadeIn = false;
    }
  } else if (!textFadeOut) {
    textHoldTime++;
    if (textHoldTime > 90) textFadeOut = true;
  } else {
    textAlpha -= 0.025;
    if (textAlpha <= 0) {
      textAlpha = 0;
      textFadeOut = false;
    }
  }

  drawTextParticles();

  // 持续随机烟花
  if (Math.random() < 0.065) {
    const x = Math.random() * W;
    const y = H;
    const targetY = Math.random() * H * 0.45 + H * 0.1;
    const palette = palettes[Math.floor(Math.random() * palettes.length)];
    launchFirework(x, y, targetY, palette);
  }

  // 两侧烟花
  if (Math.random() < 0.025) {
    const side = Math.random() < 0.5 ? 0.15 : 0.85;
    const x = W * side + (Math.random() - 0.5) * 100;
    const y = H;
    const targetY = Math.random() * H * 0.4 + H * 0.25;
    launchFirework(x, y, targetY, palettes[Math.floor(Math.random() * palettes.length)]);
  }

  requestAnimationFrame(animate);
}

function hexToRgba(hex, a) {
  const h = hex.replace("#", "");
  const r = parseInt(h.substring(0, 2), 16);
  const g = parseInt(h.substring(2, 4), 16);
  const b = parseInt(h.substring(4, 6), 16);
  return `rgba(${r},${g},${b},${a})`;
}

animate();
</script>
</body>
</html>
